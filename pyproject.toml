[project]
name = "py-code-act"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "username13121", email = "username12312355@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "openai>=3.13.0",
    "platformdirs>=4.11.8",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
py-code-act = "py_code_act:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
