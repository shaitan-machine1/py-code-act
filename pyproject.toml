[project]
name = "py-code-act"
version = "0.1.0"
description = "A Python-execution coding-agent harness"
readme = "README.md"
authors = [
    { name = "username13121", email = "username12312355@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "openai>=3.13.0",
    "platformdirs>=4.11.8",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests", "run.py"]
